name: CI

# ArtiAuto builds inside a platform checkout: it imports the platform's
# pkg/authz through `replace ... => ../..` in go.mod, and it is the submodule
# apps/artiauto of abhijeet-oxide/softwareGateway. So every job checks out the
# platform first and this repository into its place.
#
# The platform repository is private. PLATFORM_CHECKOUT_TOKEN is a repository
# secret holding a token that can read it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/apps/artiauto
    steps:
      - uses: actions/checkout@v4
        with:
          repository: abhijeet-oxide/softwareGateway
          token: ${{ secrets.PLATFORM_CHECKOUT_TOKEN }}
          path: platform
      - uses: actions/checkout@v4
        with:
          path: platform/apps/artiauto
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/apps/artiauto/go.mod
          cache-dependency-path: platform/apps/artiauto/go.sum
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
      - name: Vet
        run: go vet ./...
      # The spec is generated from the handler annotations AND committed (the
      # backend serves it at /api/docs), so it has to travel with the code.
      - name: OpenAPI spec is in sync with the code
        id: docs
        run: task docs:check
      - name: Upload the regenerated OpenAPI spec
        if: failure() && steps.docs.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec-regenerated
          path: platform/apps/artiauto/internal/api/docs/
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: platform/apps/artiauto
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Smoke (end-to-end write-back)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          ./scripts/smoke.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck and build
        run: pnpm run build
