# Self-hosted Configer stack: Go backend + SPA (nginx) + Postgres (the
# platform database: users, sessions, roles, audit). The backend serves the
# grid from a mounted Git working tree; Git remains the single source of
# truth for all configuration.
#
# (No top-level `version:` key - it is obsolete under Compose v2 and only
# produces a warning.)

services:
  backend:
    build:
      context: ../backend
    environment:
      # Core settings
      CONFIGER_ADDR: :8080
      CONFIGER_REPO: /repo
      CONFIGER_ENV: production
      CONFIGER_VERSION: 0.1.0
      CONFIGER_LOG_LEVEL: info
      CONFIGER_SYNC_SECONDS: 30

      # Git configuration
      CONFIGER_GIT_NAME: Configer Bot
      CONFIGER_GIT_EMAIL: bot@configer.local

      # Platform database: Postgres in this stack (an embedded SQLite file is
      # the default when unset - fine for single-node deployments).
      DATABASE_URL: postgres://configer:configer@postgres:5432/configer

      # GitHub OAuth login (fill in to enable multi-user mode; the callback is
      # <public-url>/api/auth/callback).
      # GITHUB_OAUTH_CLIENT_ID: ...
      # GITHUB_OAUTH_CLIENT_SECRET: ...
      # CONFIGER_OAUTH_CALLBACK: https://configer.example.com/api/auth/callback
      # CONFIGER_ADMINS: your-github-login
      # CONFIGER_DEFAULT_ROLE: editor
    volumes:
      # Read-write: Configer commits edits into the repo's real files
      # (write-back-native model), so this mount must be WRITABLE by the
      # container's user (uid 10001). Git OWNERSHIP no longer matters - Configer
      # marks the repositories it manages as trusted instead of requiring the
      # tree to be chowned - but write access is inherent to what the product
      # does, and a tree it cannot write to is reported as unavailable at
      # startup (with a plain-language reason) rather than failing at the first
      # edit. For this bundled demo, run once:
      #   sudo chown -R 10001:10001 ../sample-repo
      - ../sample-repo:/repo
      # Server-side state: the workspace registry, the platform database and
      # clones of connected repositories. Without this volume every new
      # container starts with an empty workspace.
      - configer-data:/var/lib/configer
    ports:
      - "8080:8080"
    # Wait for the database to be READY, not merely started: the short
    # `depends_on: [postgres]` form only waits for the container to exist, so a
    # cold `docker compose up` raced Postgres and the backend exited 1 with a
    # connection-refused error before the database finished initializing.
    depends_on:
      postgres:
        condition: service_healthy
    # A restart still covers anything the healthcheck cannot (a database
    # restart under the running stack, for instance).
    restart: unless-stopped
    healthcheck:
      # The binary probes its own /api/health; no curl needed in the image.
      test: ["CMD", "configer", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # The unprivileged nginx image listens on 8080 as a non-root user.
    ports:
      - "8088:8080"
    healthcheck:
      # busybox wget ships in the nginx-alpine image; no curl needed.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Platform database: users, sessions, per-app roles, audit trail.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: configer
      POSTGRES_PASSWORD: configer
      POSTGRES_DB: configer
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U configer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  configer-data:
