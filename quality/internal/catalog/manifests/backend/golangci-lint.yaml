# golangci-lint. It is not a linter, it is a RUNNER for about a hundred of them
# (staticcheck, govet, errcheck, ineffassign, gocritic, bodyclose...) behind one
# configuration, one cache and one SARIF output. Running those tools separately
# would mean a hundred manifests, a hundred processes and a hundred caches, for
# the same findings.
id: golangci-lint
name: Go static analysis
description: staticcheck, go vet, errcheck and the rest, behind one runner.
category: backend
tags: [lint, static-analysis]
tiers: [pre-commit, pr, main]
scopes: [backend]
paths: ["backend/**/*.go", "backend/.golangci.yml"]
cost: moderate
tool:
  command: golangci-lint
  args: ["run", "--output.sarif.path={out}", "--output.text.path=stdout", "./..."]
  versionArgs: ["--version"]
  workdir: backend
  pin: v2.5.0
  install: "Install golangci-lint v2: https://golangci-lint.run/welcome/install/"
  okExitCodes: [1, 3, 5, 7]
output:
  format: sarif
  file: "golangci.sarif"
  kind: sarif
defaults:
  confidence: high
  safeToAutomate: false
  effort: small
  docsUrl: https://golangci-lint.run/usage/linters/
cache:
  inputs: ["backend/**/*.go", "backend/.golangci.yml", "backend/go.sum"]
