# Region rules: an instance's name usually says where it runs, and these turn
# that into its region field - so a new estate arrives sorted by place instead
# of with a column somebody fills in by hand a hundred times.
#
# Matching is case-insensitive. By default a pattern must STAND ALONE in the
# name, bounded by anything that is not a letter or digit ("edge-tx-02" is
# Texas; "canyon-01" is not California). A site code runs straight into the rest
# of the identifier, so those opt in with "where: prefix". The longest match
# wins, whatever the order here.
#
# Defaults, not a fixed vocabulary: a repository's own .configer/regions.yaml
# wins over anything here, and detection only ever FILLS IN a region nobody set.
#
# lat/lon are optional and only place the region on the geography map. A rule
# without them still names the region; it just gets no pin.

rules:
  # Site codes. The reason "where: prefix" exists; copy this section for your
  # own estate.
  - { match: wnv, where: prefix, region: Warrenville, lat: 41.8236, lon: -88.1734 }
  - { match: atl, where: prefix, region: Atlanta, lat: 33.7490, lon: -84.3880 }
  - { match: chc, where: prefix, region: Chicago, lat: 41.8781, lon: -87.6298 }
  - { match: cle, where: prefix, region: Cleveland, lat: 41.4993, lon: -81.6944 }
  - { match: dll, where: prefix, region: Dallas, lat: 32.7767, lon: -96.7970 }
