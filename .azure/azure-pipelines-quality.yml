# Continuous Quality Platform on Azure DevOps.
#
# The same binary, the same report, the same budgets. Only the plumbing differs:
# Azure's Cache@2 instead of actions/cache, PublishTestResults@2 instead of the
# JUnit action, and the SARIF viewer extension instead of the code scanning tab.
#
# Three stages, promoted in order, mirroring the tiers:
#
#   Validate   the `pr` stage on a pull request, `main` on the default branch
#   Publish    reports, test results, artifacts, the pull-request comment
#   Gate       the merge decision, made from the report rather than from logs
#
# Import into a pipeline with:
#   trigger -> Existing Azure Pipelines YAML file -> /.azure/azure-pipelines-quality.yml

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: ["*"]

schedules:
  - cron: "0 3 * * *"
    displayName: Nightly deep scan
    branches:
      include: [main]
    always: true

variables:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  GOLANGCI_VERSION: "v2.5.0"
  TRIVY_VERSION: "0.58.1"
  GITLEAKS_VERSION: "8.24.0"
  # The tier and the base ref are derived once here so every later step agrees.
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    CQ_TIER: pr
    CQ_BASE_REF: origin/$(System.PullRequest.TargetBranchName)
    CQ_FULL: ""
  ${{ elseif eq(variables['Build.Reason'], 'Schedule') }}:
    CQ_TIER: nightly
    CQ_BASE_REF: ""
    CQ_FULL: "--full"
  ${{ else }}:
    CQ_TIER: main
    CQ_BASE_REF: ""
    CQ_FULL: "--full --baseline"
  # Azure caches by key; these are the same three levels the GitHub workflow uses.
  CQ_CACHE_KEY: 'cq | "$(Agent.OS)" | backend/go.sum | frontend/package-lock.json'
  CQ_BASELINE_KEY: 'cq-baseline | "$(Agent.OS)" | $(Build.SourceBranchName)'

stages:
  - stage: Validate
    displayName: Quality validation
    jobs:
      - job: cq
        displayName: Run the quality platform
        timeoutInMinutes: 45
        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self
            # The platform compares against the MERGE BASE, so it needs history.
            # A shallow fetch silently degrades every regression budget to "skip".
            fetchDepth: 0
            clean: true

          - task: GoTool@0
            displayName: Install Go
            inputs:
              version: $(GO_VERSION)

          - task: NodeTool@0
            displayName: Install Node
            inputs:
              versionSpec: $(NODE_VERSION)

          - task: Cache@2
            displayName: Restore the quality cache
            inputs:
              key: $(CQ_CACHE_KEY)
              restoreKeys: |
                cq | "$(Agent.OS)" | backend/go.sum
                cq | "$(Agent.OS)"
              path: $(Build.SourcesDirectory)/.cq/cache

          - task: Cache@2
            displayName: Restore the quality baseline
            inputs:
              key: $(CQ_BASELINE_KEY)
              restoreKeys: |
                cq-baseline | "$(Agent.OS)"
              path: $(Build.SourcesDirectory)/.cq/baselines

          - script: |
              set -euo pipefail
              cd frontend && npm ci
            displayName: Install frontend dependencies

          - script: |
              set -euo pipefail
              # Every tool is pinned. An unpinned scanner silently changes what
              # "green" means between two runs of the same commit.
              curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
                | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_VERSION"

              curl -sSfL -o /tmp/trivy.tar.gz \
                "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
              sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

              curl -sSfL -o /tmp/gitleaks.tar.gz \
                "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
              sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

              go install golang.org/x/vuln/cmd/govulncheck@latest
              go install github.com/oasdiff/oasdiff@latest
              go install golang.org/x/perf/cmd/benchstat@latest

              echo "##vso[task.prependpath]$(go env GOPATH)/bin"
            displayName: Install the analyzers

          - script: npx --yes playwright install --with-deps chromium
            displayName: Install a browser for the runtime probe

          - script: make cq
            displayName: Build cq

          - script: ./quality/bin/cq doctor
            displayName: What is installed
            # A missing tool is reported as a skip, never as a pass, so this is
            # informational rather than a gate.
            continueOnError: true

          - script: ./quality/bin/cq plan --tier "$(CQ_TIER)" ${CQ_BASE_REF:+--base "$CQ_BASE_REF"} $(CQ_FULL)
            displayName: What will run, and why

          - script: |
              set -uo pipefail
              ./quality/bin/cq run \
                --tier "$(CQ_TIER)" \
                ${CQ_BASE_REF:+--base "$CQ_BASE_REF"} \
                $(CQ_FULL)
              echo "##vso[task.setvariable variable=cqExit;isOutput=true]$?"
            name: run
            displayName: Run the quality platform
            # The gate is decided in its own stage, from the report, so the
            # pull request still gets its comment and its artifacts when the
            # run fails. A red build with no explanation is what this platform
            # exists to prevent.
            continueOnError: true

          - publish: $(Build.SourcesDirectory)/.cq
            artifact: quality-report
            displayName: Publish the reports
            condition: always()

  - stage: Publish
    displayName: Publish the results
    dependsOn: Validate
    condition: always()
    jobs:
      - job: publish
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none

          - download: current
            artifact: quality-report
            displayName: Fetch the reports

          - task: PublishTestResults@2
            displayName: Publish the budget results
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: "$(Pipeline.Workspace)/quality-report/report.junit.xml"
              testRunTitle: Quality budgets
              failTaskOnFailedTests: false
              mergeTestResults: true

          - task: PublishCodeCoverageResults@2
            displayName: Publish coverage
            condition: always()
            continueOnError: true
            inputs:
              summaryFileLocation: "$(Pipeline.Workspace)/quality-report/artifacts/coverage.out"

          # The SARIF viewer extension picks up any .sarif under a build
          # artifact named CodeAnalysisLogs. Nothing else is needed.
          - task: CopyFiles@2
            displayName: Stage the SARIF for the viewer
            condition: always()
            inputs:
              sourceFolder: "$(Pipeline.Workspace)/quality-report"
              contents: "report.sarif"
              targetFolder: "$(Build.ArtifactStagingDirectory)/CodeAnalysisLogs"

          - publish: $(Build.ArtifactStagingDirectory)/CodeAnalysisLogs
            artifact: CodeAnalysisLogs
            displayName: Publish findings to the SARIF viewer
            condition: always()

          - script: |
              set -euo pipefail
              # Azure has no job-summary markdown surface, so the report goes to
              # the log where it is at least readable without downloading it.
              echo "==================== QUALITY REPORT ===================="
              cat "$(Pipeline.Workspace)/quality-report/report.md"
              echo "======================================================="
            displayName: Print the report
            condition: always()

          - task: PowerShell@2
            displayName: Comment on the pull request
            condition: and(always(), eq(variables['Build.Reason'], 'PullRequest'))
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            inputs:
              targetType: inline
              script: |
                # One thread, updated in place. A new comment per push turns a
                # busy pull request into an unreadable wall.
                $body = Get-Content "$(Pipeline.Workspace)/quality-report/report.md" -Raw
                $uri  = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullRequests/$(System.PullRequest.PullRequestId)/threads?api-version=7.1"
                $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"; "Content-Type" = "application/json" }

                $marker = "<!-- continuous-quality -->"
                $existing = (Invoke-RestMethod -Uri $uri -Headers $headers -Method Get).value |
                  Where-Object { $_.comments[0].content -like "*$marker*" } | Select-Object -First 1

                $content = "$marker`n$body"
                if ($existing) {
                  $update = @{ content = $content } | ConvertTo-Json -Depth 5
                  $commentUri = "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullRequests/$(System.PullRequest.PullRequestId)/threads/$($existing.id)/comments/$($existing.comments[0].id)?api-version=7.1"
                  Invoke-RestMethod -Uri $commentUri -Headers $headers -Method Patch -Body $update | Out-Null
                } else {
                  $thread = @{ comments = @(@{ parentCommentId = 0; content = $content; commentType = 1 }); status = 1 }
                  Invoke-RestMethod -Uri $uri -Headers $headers -Method Post -Body ($thread | ConvertTo-Json -Depth 5) | Out-Null
                }

  - stage: Gate
    displayName: Quality gate
    dependsOn: Validate
    condition: always()
    jobs:
      - job: gate
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: none
          - download: current
            artifact: quality-report

          - script: |
              set -euo pipefail
              report="$(Pipeline.Workspace)/quality-report/report.json"
              if [ ! -f "$report" ]; then
                echo "##vso[task.logissue type=error]The quality platform did not produce a report, so this run cannot be judged."
                exit 1
              fi

              verdict=$(node -e "process.stdout.write(require('$report').summary.verdict)")
              echo "Verdict: $verdict"

              if [ "$verdict" = "fail" ]; then
                node -e "
                  const r = require('$report');
                  for (const b of r.budgets.filter(b => b.status === 'fail' && b.blocking)) {
                    console.log('##vso[task.logissue type=error]' + b.budget + ': ' + b.message);
                  }
                  for (const s of r.summary.nextSteps || []) console.log('  next: ' + s);
                "
                echo "##vso[task.complete result=Failed;]Quality budgets exceeded"
                exit 1
              fi

              if [ "$verdict" = "error" ]; then
                echo "##vso[task.logissue type=error]The quality platform itself could not finish. See platformErrors in the report."
                exit 1
              fi

              if [ "$verdict" = "warn" ]; then
                echo "##vso[task.complete result=SucceededWithIssues;]Findings worth reading, nothing blocking"
              fi
            displayName: Enforce the quality budgets
