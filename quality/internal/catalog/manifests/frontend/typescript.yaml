# The TypeScript compiler in --noEmit mode. Nothing else can answer whether the
# program is well typed, and a type error is the cheapest possible finding: it
# is always real, always local, and never a matter of taste.
id: typescript
name: TypeScript typecheck
description: The frontend does not typecheck.
category: frontend
tags: [types]
tiers: [local, pre-commit, pr, main]
scopes: [frontend]
paths: ["web/**/*.{ts,tsx}", "web/tsconfig.json"]
cost: moderate
tool:
  command: npx
  args: ["tsc", "--noEmit", "--pretty", "false"]
  probe: ["npx", "--no-install", "tsc", "--version"]
  workdir: web
  install: "Run `npm install` in web/."
output:
  format: exit-code
defaults:
  severity: error
  confidence: high
  effort: small
  recommendation: "Fix the type errors listed in the artifact log; each names a file and a line."
cache:
  inputs: ["web/src/**", "web/tsconfig.json", "web/package-lock.json"]
